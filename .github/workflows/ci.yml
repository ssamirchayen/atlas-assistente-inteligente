name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  atlas:
    name: Atlas principal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest Atlas
        run: python -m pytest -q --ignore-glob='**/test_radiology_*.py'

  radiology:
    name: Radiologia experimental
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-radiology.txt
            requirements-radiology-dev.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-radiology.txt -r requirements-radiology-dev.txt
      - name: Ruff Radiologia
        run: python -m ruff check atlas/radiology atlas/tests/test_radiology_*.py
      - name: Pytest Radiologia
        run: python -m pytest -q atlas/tests/test_radiology_*.py
